<nav style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); font-family: 'Inter', sans-serif;">
  
  <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" routerLink="/">
    <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);">
      ⚽
    </div>
    <h2 style="margin: 0; font-size: 22px; font-weight: 800; color: #1e293b; letter-spacing: -0.5px;">Saha<span style="color: #10b981;">Kirala</span></h2>
  </div>

  <div style="display: flex; gap: 16px; align-items: center;">
    <a routerLink="/" style="color: #475569; text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 12px; border-radius: 6px; transition: all 0.2s;" onmouseover="this.style.color='#10b981'; this.style.backgroundColor='#f0fdf4'" onmouseout="this.style.color='#475569'; this.style.backgroundColor='transparent'">Sahanı Bul</a>
    
    <ng-container *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login" style="color: white; text-decoration: none; font-weight: 600; font-size: 15px; background: linear-gradient(135deg, #3b82f6, #2563eb); padding: 10px 24px; border-radius: 8px; transition: all 0.3s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 16px rgba(59, 130, 246, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(59, 130, 246, 0.3)'">Giriş Yap / Üye Ol</a>
    </ng-container>

    <ng-container *ngIf="authService.isLoggedIn()">
      <ng-container *ngIf="authService.currentUser$ | async as user">
        <!-- Panelim sadece owner (3 veya Owner) ve Admin (1) için görünür -->
        <a *ngIf="user.role == '1' || user.role == '3' || user.role === 'Admin' || user.role === 'Owner'" routerLink="/owner-dashboard" style="color: #475569; text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 12px; border-radius: 6px; transition: all 0.2s;" onmouseover="this.style.color='#10b981'; this.style.backgroundColor='#f0fdf4'" onmouseout="this.style.color='#475569'; this.style.backgroundColor='transparent'">Panelim</a>
        
        <div style="width: 1px; height: 24px; background-color: #e2e8f0; margin: 0 8px;"></div>
        
        <div style="position: relative;">
          <button (click)="toggleProfileDropdown()" style="width: 40px; height: 40px; border-radius: 50%; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; padding: 0; margin-left: 4px;" onmouseover="this.style.backgroundColor='#f1f5f9'; this.style.borderColor='#cbd5e1'" onmouseout="this.style.backgroundColor='#f8fafc'; this.style.borderColor='#e2e8f0'">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </button>
          
          <div *ngIf="isProfileDropdownOpen" style="position: absolute; top: calc(100% + 8px); right: 0; width: 240px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; overflow: hidden; display: flex; flex-direction: column; z-index: 100;">
            <div style="padding: 16px; border-bottom: 1px solid #f1f5f9; background: #fafafa;">
              <span style="display: block; font-size: 12px; color: #64748b; font-weight: 500; margin-bottom: 4px;">Hoşgeldin</span>
              <span style="display: block; font-size: 16px; color: #0f172a; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.name }}</span>
              <span style="display: inline-block; font-size: 11px; color: #3b82f6; background: #eff6ff; padding: 2px 8px; border-radius: 12px; font-weight: 600; margin-bottom: 6px;">{{ user.roleText }}</span>
              <span style="display: block; font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ user.email || user.phoneNumber }}</span>
            </div>
            <div style="padding: 8px; display: flex; flex-direction: column; gap: 4px;">
              <a routerLink="/user/profile" (click)="isProfileDropdownOpen = false" style="text-decoration: none; color: #334155; padding: 10px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; transition: all 0.2s; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.backgroundColor='#f8fafc'; this.style.color='#10b981'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#334155'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Profil Ayarları
              </a>
              <a routerLink="/user/sessions" (click)="isProfileDropdownOpen = false" style="text-decoration: none; color: #334155; padding: 10px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; transition: all 0.2s; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.backgroundColor='#f8fafc'; this.style.color='#10b981'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#334155'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Seanslarım
              </a>
              <a routerLink="/user/favorites" (click)="isProfileDropdownOpen = false" style="text-decoration: none; color: #334155; padding: 10px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; transition: all 0.2s; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.backgroundColor='#f8fafc'; this.style.color='#10b981'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#334155'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                Favorilerim
              </a>
              <div style="height: 1px; background-color: #f1f5f9; margin: 4px 0;"></div>
              <button (click)="cikisYap()" style="width: 100%; text-align: left; background: transparent; border: none; color: #ef4444; padding: 10px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.backgroundColor='#fef2f2'" onmouseout="this.style.backgroundColor='transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Çıkış Yap
              </button>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
</nav>

<main style="background-color: #f8fafc; min-height: calc(100vh - 73px); font-family: 'Inter', sans-serif;">
  <router-outlet></router-outlet>
</main>
