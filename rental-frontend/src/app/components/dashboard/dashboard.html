<div style="padding: 30px; font-family: sans-serif; display: flex; gap: 40px;">

  <!-- SOL TARAF: YENİ SAHA EKLEME FORMU -->
  <div style="flex: 1; background-color: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; height: fit-content;">
    <h3>Yeni Saha Ekle</h3>

    <div style="margin-bottom: 15px;">
      <label>Saha Adı:</label>
      <input type="text" [(ngModel)]="yeniSaha.name" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Saha Tipi:</label>
      <select [(ngModel)]="yeniSaha.type" style="width: 100%; padding: 8px; margin-top: 5px;">
        <option value="Halısaha">Halısaha</option>
        <option value="Basketbol">Basketbol</option>
        <option value="Tenis">Tenis</option>
        <option value="Voleybol">Voleybol</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Saatlik Ücret (₺):</label>
      <input type="number" [(ngModel)]="yeniSaha.hourlyPrice" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <button (click)="sahaKaydet()" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
      Sahayı Kaydet
    </button>
  </div>

  <!-- SAĞ TARAF: SAHALARIN LİSTESİ -->
  <div style="flex: 2;">
    <h3>Mevcut Sahalarımız</h3>

    <!-- Modern Angular @for döngüsü -->
    @for (saha of sahaListesi; track saha.id) {
    <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; background-color: white;">
      <div>
        <strong style="font-size: 18px; color: #0056b3;">{{ saha.name }}</strong> <br>
        <span style="color: #666; font-size: 14px;">Tipi: {{ saha.type }} | Ücret: {{ saha.hourlyPrice }} ₺/Saat</span>
      </div>
      <div>
        <span [style.color]="saha.isActive ? 'green' : 'red'">
          {{ saha.isActive ? '🟢 Aktif' : '🔴 Pasif' }}
        </span>
      </div>
    </div>
    } @empty {
    <div style="padding: 20px; text-align: center; color: #777; border: 1px dashed #ccc; border-radius: 5px;">
      Henüz sisteme eklenmiş bir saha yok. Yandaki formdan ilk sahayı ekleyebilirsin!
    </div>
    }
  </div>

</div>
