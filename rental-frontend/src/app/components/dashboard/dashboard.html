<!-- ANA SAYFA (VİTRİN) -->
<div style="padding: 40px; font-family: sans-serif; max-width: 1200px; margin: 0 auto;">

  <h1 style="color: #333; margin-bottom: 30px;">Tüm Sahalar</h1>

  <!-- Sahaların Listelendiği Izgara (Grid) -->
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
    @for (saha of sahaListesi; track saha.id) {
    <div style="border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background-color: white;">

      <!-- Saha Resmi (Şimdilik yer tutucu bir gri kutu) -->
      <div style="height: 150px; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #999;">
        Görsel Gelecek
      </div>

      <!-- Saha Bilgileri -->
      <div style="padding: 20px;">
        <h3 style="margin: 0 0 10px 0; color: #1a1a1a;">{{ saha.name }}</h3>
        <p style="margin: 0; color: #666; font-size: 14px;">Tipi: {{ saha.type }}</p>
        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
          <strong style="color: #84cc16; font-size: 18px;">{{ saha.hourlyPrice }} ₺</strong>
          <button style="background-color: #1a1a1a; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Hemen Kirala
          </button>
        </div>
      </div>
    </div>
    } @empty {
    <p>Henüz sistemde hiç saha yok.</p>
    }
  </div>

</div>
