<div class="page-container">
  <div class="form-wrapper">
    
    <div class="header-section">
      <h2 class="page-title">Sisteme Yeni Saha Ekle</h2>
      <p class="page-subtitle">Tesisinizi ve kiralama şartlarını detaylıca tanımlayın. Girdiğiniz bilgiler kullanıcıların arama sonuçlarında görünür.</p>
    </div>

    <!-- HATA VE MESAJ KUTULARI -->
    <div *ngIf="hata" class="alert-box error-box">
      {{ hata }}
    </div>
    
    <div *ngIf="mesaj" class="alert-box success-box">
      {{ mesaj }}
    </div>

    <!-- SHARED COURT FORM -->
    <app-court-form 
      (formSubmit)="onFormSubmit($event)"
      [isSubmitting]="isSubmitting"
      submitLabel="Sahayı Sisteme Kaydet">
    </app-court-form>

  </div>
</div>
