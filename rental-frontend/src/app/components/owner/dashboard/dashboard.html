<div class="dashboard-container">
  <h2>Özet</h2>
  <p class="subtitle">İşletmenizin genel durumunu buradan takip edebilirsiniz.</p>

  <div *ngIf="isLoading" class="loading-state">
    Yükleniyor...
  </div>

  <div class="stats-grid" *ngIf="!isLoading">
    <div class="stat-card">
      <div class="stat-icon courts">
        <i class="fas fa-futbol"></i>
      </div>
      <div class="stat-info">
        <h3>Toplam Saha</h3>
        <p class="stat-value">{{ stats.totalCourts }}</p>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon bookings">
        <i class="fas fa-calendar-check"></i>
      </div>
      <div class="stat-info">
        <h3>Onaylı Rezervasyon</h3>
        <p class="stat-value">{{ stats.totalBookings }}</p>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon revenue">
        <i class="fas fa-lira-sign"></i>
      </div>
      <div class="stat-info">
        <h3>Beklenen Gelir</h3>
        <p class="stat-value">{{ stats.activeRevenue }} ₺</p>
      </div>
    </div>
  </div>

  <div class="chart-container" *ngIf="!isLoading">
    <div class="chart-header">
      <h3>Gelir Analizi</h3>
      <div class="chart-filters">
        <button (click)="changeTimeframe('week')" [class.active]="timeframe === 'week'">Son 1 Hafta</button>
        <button (click)="changeTimeframe('month')" [class.active]="timeframe === 'month'">Son 1 Ay</button>
        <button (click)="changeTimeframe('year')" [class.active]="timeframe === 'year'">Son 1 Yıl</button>
      </div>
    </div>
    
    <div class="chart-body">
      <apx-chart
        *ngIf="chartOptions"
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [dataLabels]="chartOptions.dataLabels"
        [stroke]="chartOptions.stroke"
        [title]="chartOptions.title"
        [tooltip]="chartOptions.tooltip"
        [colors]="chartOptions.colors"
        [fill]="chartOptions.fill"
      ></apx-chart>
    </div>
  </div>
</div>
