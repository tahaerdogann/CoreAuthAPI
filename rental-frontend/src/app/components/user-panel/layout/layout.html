<style>
  .user-layout-container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 32px;
    align-items: start;
  }

  .user-sidebar {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
    padding: 24px 16px;
    position: sticky;
    top: 100px;
  }

  .user-sidebar-title {
    font-size: 14px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
    padding-left: 12px;
  }

  .user-nav-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .user-nav-link {
    text-decoration: none;
    color: #475569;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 500;
    font-size: 15px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-nav-link:hover {
    background-color: #f8fafc;
    color: #1e293b;
    transform: translateX(2px);
  }

  .user-nav-link.active {
    background-color: #ecfdf5;
    color: #10b981;
    font-weight: 600;
  }

  .user-nav-link.active svg {
    stroke: #10b981;
  }
  
  .user-nav-link svg {
    stroke: currentColor;
    transition: stroke 0.2s ease;
  }

  @media (max-width: 768px) {
    .user-layout-container {
      grid-template-columns: 1fr;
      gap: 24px;
      margin: 20px auto;
    }
    .user-sidebar {
      position: static;
    }
  }
</style>

<div class="user-layout-container">
  <aside class="user-sidebar">
    <div class="user-sidebar-title">Hesabım</div>
    <nav class="user-nav-menu">
      <a routerLink="/user/profile" routerLinkActive="active" class="user-nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Profil Ayarları
      </a>
      
      <a routerLink="/user/sessions" routerLinkActive="active" class="user-nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Seanslarım
      </a>
      
      <a routerLink="/user/favorites" routerLinkActive="active" class="user-nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        Favorilerim
      </a>
    </nav>
  </aside>

  <main class="user-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
