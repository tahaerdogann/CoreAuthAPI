<div>
  <h1 style="font-size: 28px; font-weight: 700; color: #1e293b; margin-bottom: 24px;">Profil Ayarları</h1>

  <div style="background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; padding: 24px; margin-bottom: 24px;">
    <h2 style="font-size: 18px; font-weight: 600; color: #334155; margin-bottom: 16px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">Kişisel Bilgiler</h2>
    
    <div *ngIf="profileMessage" style="padding: 12px; background-color: #dcfce7; color: #166534; border-radius: 6px; margin-bottom: 16px; font-size: 14px;">{{ profileMessage }}</div>
    <div *ngIf="profileError" style="padding: 12px; background-color: #fee2e2; color: #991b1b; border-radius: 6px; margin-bottom: 16px; font-size: 14px;">{{ profileError }}</div>

    <form (ngSubmit)="updateProfile()" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">Ad</label>
        <input type="text" [(ngModel)]="profileData.name" name="name" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" required>
      </div>
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">Soyad</label>
        <input type="text" [(ngModel)]="profileData.surname" name="surname" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" required>
      </div>
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">E-posta</label>
        <input type="email" [(ngModel)]="profileData.email" name="email" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" required>
      </div>
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">Telefon Numarası</label>
        <input type="tel" pattern="^05\d{9}$" [(ngModel)]="profileData.phoneNumber" name="phone" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" placeholder="05551234567" title="Telefon numarası 05 ile başlamalı ve 11 haneli olmalıdır.">
      </div>
      <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 8px;">
        <button type="submit" style="background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 500; font-size: 14px; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#2563eb'" onmouseout="this.style.backgroundColor='#3b82f6'">Bilgileri Güncelle</button>
      </div>
    </form>
  </div>

  <div style="background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; padding: 24px;">
    <h2 style="font-size: 18px; font-weight: 600; color: #334155; margin-bottom: 16px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">Şifre Değiştirme</h2>
    
    <div *ngIf="passwordMessage" style="padding: 12px; background-color: #dcfce7; color: #166534; border-radius: 6px; margin-bottom: 16px; font-size: 14px;">{{ passwordMessage }}</div>
    <div *ngIf="passwordError" style="padding: 12px; background-color: #fee2e2; color: #991b1b; border-radius: 6px; margin-bottom: 16px; font-size: 14px;">{{ passwordError }}</div>

    <form (ngSubmit)="changePassword()" style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">Mevcut Şifre</label>
        <input type="password" [(ngModel)]="passwordData.currentPassword" name="currentPassword" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" required>
      </div>
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">Yeni Şifre</label>
        <input type="password" [(ngModel)]="passwordData.newPassword" name="newPassword" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" required>
      </div>
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 6px;">Yeni Şifre (Tekrar)</label>
        <input type="password" [(ngModel)]="passwordData.confirmPassword" name="confirmPassword" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'" required>
      </div>
      <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
        <button type="submit" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 500; font-size: 14px; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#059669'" onmouseout="this.style.backgroundColor='#10b981'">Şifreyi Güncelle</button>
      </div>
    </form>
  </div>
</div>
