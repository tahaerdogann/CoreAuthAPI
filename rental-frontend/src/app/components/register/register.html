<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;">

    <h2 style="margin-bottom: 5px; color: #333;">Hesap Oluştur</h2>
    <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">Adım {{ currentStep }} / 3</p>

    <!-- FORM BAŞLANGICI -->
    <form [formGroup]="registerForm">

      <!-- ================= ADIM 1: AD & SOYAD ================= -->
      <div *ngIf="currentStep === 1">
        <div style="text-align: left; margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Adınız:</label>
          <input type="text" formControlName="name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="text-align: left; margin-bottom: 25px;">
          <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Soyadınız:</label>
          <input type="text" formControlName="surname" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <button type="button" (click)="nextStep()" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
          İleri
        </button>
      </div>

      <!-- ================= ADIM 2: E-POSTA VEYA TELEFON ================= -->
      <div *ngIf="currentStep === 2">

        <!-- E-Posta Modu -->
        <ng-container *ngIf="contactMethod === 'email'">
          <div style="text-align: left; margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">E-posta Adresi:</label>
            <input type="email" formControlName="email" placeholder="ornek@mail.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          </div>
          <p style="font-size: 13px; text-align: left; margin-bottom: 20px;">
            <a href="javascript:void(0)" (click)="toggleContactMethod()" style="color: #007bff; text-decoration: none;">Veya telefon numarası ile kayıt ol</a>
          </p>
        </ng-container>

        <!-- Telefon Modu -->
        <ng-container *ngIf="contactMethod === 'phone'">
          <div style="text-align: left; margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Telefon Numarası:</label>
            <input type="text" formControlName="phoneNumber" placeholder="0555..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          </div>
          <p style="font-size: 13px; text-align: left; margin-bottom: 20px;">
            <a href="javascript:void(0)" (click)="toggleContactMethod()" style="color: #007bff; text-decoration: none;">Veya e-posta ile kayıt ol</a>
          </p>
        </ng-container>

        <div style="display: flex; gap: 10px;">
          <button type="button" (click)="previousStep()" style="width: 30%; padding: 12px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Geri</button>
          <button type="button" (click)="nextStep()" style="width: 70%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">İleri</button>
        </div>
      </div>

      <!-- ================= ADIM 3: ŞİFRE OLUŞTURMA ================= -->
      <div *ngIf="currentStep === 3">
        <div style="text-align: left; margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Şifre:</label>
          <input type="password" formControlName="password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="text-align: left; margin-bottom: 25px;">
          <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Şifreyi Doğrula:</label>
          <input type="password" formControlName="confirmPassword" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          <small *ngIf="registerForm.get('confirmPassword')?.hasError('passwordMismatch')" style="color: #e74c3c;">Şifreler eşleşmiyor!</small>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="button" (click)="previousStep()" style="width: 30%; padding: 12px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Geri</button>
          <button type="button" (click)="kayitOl()" style="width: 70%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Kayıt İşlemini Tamamla</button>
        </div>
      </div>

    </form>

    <!-- Uyarı Mesajları -->
    <p *ngIf="mesaj" style="color: #27ae60; margin-top: 15px; font-weight: bold;">{{ mesaj }}</p>
    <p *ngIf="hata" style="color: #c0392b; margin-top: 15px; font-weight: bold;">{{ hata }}</p>

    <div style="margin-top: 25px;">
      <a href="/login" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">Zaten hesabın var mı? Giriş yap</a>
    </div>

  </div>
</div>
