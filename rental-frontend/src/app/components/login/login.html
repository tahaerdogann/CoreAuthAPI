<div style="min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); font-family: 'Inter', sans-serif; padding: 20px;">
  
  <div style="background: white; width: 100%; max-width: 420px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative; overflow: hidden;">
    
    <!-- Dekoratif Elementler -->
    <div style="position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: linear-gradient(135deg, #3b82f6, #60a5fa); border-radius: 50%; opacity: 0.1;"></div>
    <div style="position: absolute; bottom: -30px; left: -30px; width: 100px; height: 100px; background: linear-gradient(135deg, #10b981, #34d399); border-radius: 50%; opacity: 0.1;"></div>

    <div style="position: relative; z-index: 1;">
      <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="margin: 0; color: #1e293b; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">Giriş Yap</h2>
        <p style="margin: 8px 0 0 0; color: #64748b; font-size: 15px;">Kaldığınız yerden devam edin.</p>
      </div>

      <!-- Hata Mesajı -->
      <div *ngIf="hataMesaji" style="background: #fef2f2; color: #b91c1c; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 20px; border: 1px solid #fecaca;">
        {{ hataMesaji }}
      </div>

      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div>
          <label style="display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px;">E-posta Adresi</label>
          <input type="email" [(ngModel)]="email" placeholder="ornek@mail.com" style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box; font-family: inherit;" onfocus="this.style.borderColor='#3b82f6'; this.style.boxShadow='0 0 0 3px rgba(59, 130, 246, 0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
        </div>

        <div>
          <label style="display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px;">Şifre</label>
          <input type="password" [(ngModel)]="password" placeholder="••••••••" style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box; font-family: inherit;" onfocus="this.style.borderColor='#3b82f6'; this.style.boxShadow='0 0 0 3px rgba(59, 130, 246, 0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
        </div>

        <button (click)="girisYap()" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(59, 130, 246, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(59, 130, 246, 0.3)'">
          Giriş Yap
        </button>
      </div>

      <div style="text-align: center; margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
        <p style="margin: 0; color: #64748b; font-size: 14px;">
          Hesabın yok mu? 
          <a routerLink="/register" style="color: #3b82f6; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#1d4ed8'" onmouseout="this.style.color='#3b82f6'">Hemen Kayıt Ol</a>
        </p>
      </div>
    </div>
  </div>

</div>
